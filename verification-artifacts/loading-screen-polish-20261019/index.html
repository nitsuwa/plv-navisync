<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TEST ONLY — PLV NaviSync Loading Screen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { LoadingScreen } from "/src/components/LoadingScreen.tsx";
      import "/src/styles/index.css";

      if (new URLSearchParams(window.location.search).get("motion") === "reduce") {
        window.matchMedia = (query) => ({
          matches: query.includes("prefers-reduced-motion"),
          media: query,
          onchange: null,
          addListener() {},
          removeListener() {},
          addEventListener() {},
          removeEventListener() {},
          dispatchEvent() { return false; },
        });
      }

      createRoot(document.getElementById("root")).render(React.createElement(LoadingScreen));
    </script>
  </body>
</html>
