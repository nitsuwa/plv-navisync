<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#0e2a6e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PLV NaviSync" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>PLV NaviSync — Smart Campus Navigator</title>
    <meta name="description" content="Interactive campus map and navigation for Pamantasan ng Lungsod ng Valenzuela. Find buildings, get directions, and explore the campus." />
    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-title" content="PLV NaviSync" />
    <script>
      (function () {
        var stored = localStorage.getItem("plv-theme");
        var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.background = dark ? "#070d1a" : "#eef2fa";

        // ── PWA install prompt ─────────────────────────────────────
        // Captured before React boots; src/lib/pwa.ts picks it up and
        // owns the install UI.
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__plvInstallPrompt = e;
        });

        // ── Dev-only service worker cleanup ───────────────────────
        // Production registers /sw.js from src/lib/pwa.ts. A worker left
        // behind by a production build must never sit in front of the Vite
        // dev server: its cache/update lifecycle can make a working Map
        // Builder appear to refresh or remount. `vite preview` builds keep
        // their worker so the PWA can be tested locally.
        var isProdBuild = '%PROD%' === 'true';
        var isLocalDev = !isProdBuild && (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
        if (isLocalDev && 'serviceWorker' in navigator) {
          var clearLocalServiceWorkers = function () {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            }).then(function () {
              if (!('caches' in window)) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (key) {
                  return key.indexOf('plv-navisync') === 0;
                }).map(function (key) { return caches.delete(key); }));
              });
            }).catch(function () {});
          };
          clearLocalServiceWorkers();
          window.addEventListener('load', clearLocalServiceWorkers, { once: true });
        }
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      html { background: #eef2fa; }
      html.dark { background: #070d1a; }
      #root { min-height: 100%; }
      /* Prevent tap highlight on mobile */
      * { -webkit-tap-highlight-color: transparent; }
      /* Smooth iOS momentum scrolling */
      body {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
      /* Regular scrolling pages keep Android's pull-to-refresh, the only
         refresh gesture in an installed app. Map/editor views keep it off. */
      html.allow-pull-refresh body { overscroll-behavior-y: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
